
name: BunnyX Kernel Build - BakaSU Inline Hooks

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to migrate and build'
        required: true
        type: choice
        default: 'BakaSU-Test'
        options:
          - ReSukiSU-clean
          - Ksu-3.4.0-sufs-2.3.0
          - BakaSU-Test
          - Resukisu-Sony-LMK-Port
          - fsync
          - ResukiSU-msm-performance
          - mcqueen
          - mcqueen-ksu
          - Ksu-3.3.0-susfs-2.2.0-backup
      defconfig:
        description: 'Defconfig'
        required: true
        type: choice
        default: 'atoll_defconfig'
        options:
          - atoll_defconfig
          - atoll-perf_defconfig
          - atoll-bakasu_defconfig
      migrate_to_bakasu:
        description: 'Migrate source and apply SUSFS inline hooks'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BRANCH: ${{ inputs.branch }}
      DEFCONFIG: ${{ inputs.defconfig }}
      BUILD_EXIT: '1'

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup build environment
        run: |
          set -euo pipefail
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex curl git zip unzip libssl-dev python3 \
            ccache clang lld gcc g++ libncurses5-dev lib32z1-dev
          ccache --max-size=5G
          ccache --zero-stats

      - name: Cache Toolchains
        uses: actions/cache@v4
        with:
          path: |
            toolchains/clang/
            toolchains/gcc/
          key: ${{ runner.os }}-toolchains-${{ hashFiles('build.sh') }}
          restore-keys: |
            ${{ runner.os }}-toolchains-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ env.BRANCH }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.BRANCH }}-
            ${{ runner.os }}-ccache-

      - name: Check migration prerequisites
        if: ${{ inputs.migrate_to_bakasu == true }}
        run: |
          set -euo pipefail
          test -f build.sh
          test -d arch/arm64/configs
          test -d drivers/kernelsu || test -d KernelSU
          echo "Migration enabled for $BRANCH"
          echo "This is a disposable CI checkout; source changes will not be pushed."

      - name: Download and validate migration scripts
        if: ${{ inputs.migrate_to_bakasu == true }}
        run: |
          set -euo pipefail
          mkdir -p migration-audit
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh \
            -o migration-audit/bakasu-setup.sh
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh \
            -o migration-audit/susfs_inline_hook_patches.sh
          bash -n migration-audit/bakasu-setup.sh
          bash -n migration-audit/susfs_inline_hook_patches.sh
          sha256sum migration-audit/*.sh | tee migration-audit/SHA256SUMS

      - name: Run BakaSU upstream setup
        if: ${{ inputs.migrate_to_bakasu == true }}
        run: |
          set -euo pipefail
          bash migration-audit/bakasu-setup.sh main
          test -d drivers/kernelsu || test -d KernelSU || {
            echo "::error::BakaSU setup did not leave the expected source directory."
            exit 1
          }

      - name: Apply SUSFS inline hooks
        if: ${{ inputs.migrate_to_bakasu == true }}
        run: |
          set -euo pipefail
          bash migration-audit/susfs_inline_hook_patches.sh
          git diff --check
          git diff --stat | tee migration-audit/inline-hook-diff-stat.txt
          git diff --binary > migration-audit/migration-source.patch
          test -s migration-audit/migration-source.patch || {
            echo "::error::No source changes detected after migration."
            exit 1
          }

      - name: Prepare BakaSU defconfig
        if: ${{ inputs.migrate_to_bakasu == true && inputs.defconfig == 'atoll-bakasu_defconfig' }}
        run: |
          set -euo pipefail
          BASE=arch/arm64/configs/atoll-perf_defconfig
          TARGET=arch/arm64/configs/atoll-bakasu_defconfig
          test -f "$BASE"
          cp "$BASE" "$TARGET"

          KEYS='CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_MULTI_MANAGER_SUPPORT|CONFIG_KSU_TRACEPOINT_HOOK|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS_SUS_PATH|CONFIG_KSU_SUSFS_SUS_MOUNT|CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT|CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT|CONFIG_KSU_SUSFS_SUS_KSTAT|CONFIG_KSU_SUSFS_SPOOF_UNAME|CONFIG_KSU_SUSFS_ENABLE_LOG|CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS|CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG|CONFIG_KSU_SUSFS_OPEN_REDIRECT|CONFIG_KSU_SUSFS_SUS_MAP'

          sed -i -E \
            "/^#? ?(${KEYS})=(y|m|n|[0-9]+|\".*\")$/d; /^# (${KEYS}) is not set$/d" \
            "$TARGET"

          cat >> "$TARGET" <<'CONFIG_EOF'

          # BakaSU / SUSFS requested options
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=y

          # Hook selection
          # CONFIG_KSU_TRACEPOINT_HOOK is not set
          # CONFIG_KSU_MANUAL_HOOK is not set

          # SUSFS
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_EOF

          echo "=== BakaSU defconfig ==="
          tail -n 25 "$TARGET"

      - name: Validate selected defconfig
        if: ${{ inputs.migrate_to_bakasu == true }}
        run: |
          set -euo pipefail
          CFG="arch/arm64/configs/$DEFCONFIG"
          test -f "$CFG"
          grep -q '^CONFIG_KSU=y$' "$CFG" || {
            echo "::error::CONFIG_KSU=y missing from $CFG"
            exit 1
          }
          echo "Selected defconfig: $CFG"
          echo "Kconfig may drop unsupported symbols during olddefconfig."

      - name: Build Kernel
        id: kernel_build
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x build.sh
          USE_CCACHE=1 \
          CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache" \
          DEFCONFIG="$DEFCONFIG" \
          ./build.sh 2>&1 | tee build_full.log

          rc=${PIPESTATUS[0]}
          echo "BUILD_EXIT=$rc" >> "$GITHUB_ENV"
          echo "build_status=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
        env:
          USE_CCACHE: 1
          CCACHE_DIR: ${{ github.workspace }}/.ccache

      - name: Save Build Log and Migration Audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.BRANCH }}-${{ github.run_number }}
          path: |
            build_full.log
            out/build.log
            out/.config
            out/.config.old
            migration-audit/
          retention-days: 7
          if-no-files-found: ignore

      - name: Prepare Error Log
        if: always() && (env.BUILD_EXIT != '0' || steps.kernel_build.outcome == 'failure')
        run: |
          mkdir -p error_report
          {
            echo "BUILD FAILED"
            echo "Branch: $BRANCH"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo
            echo "LAST 100 LINES:"
            if [ -f build_full.log ]; then tail -n 100 build_full.log; fi
            echo
            echo "FINAL CONFIG:"
            if [ -f out/.config ]; then
              grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_MULTI_MANAGER_SUPPORT|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_TRACEPOINT_HOOK|CONFIG_KSU_SUSFS_)=' out/.config || true
            fi
          } > error_report/summary.txt
          cp build_full.log error_report/ 2>/dev/null || true

      - name: Telegram Notify - Failure
        if: always() && (env.BUILD_EXIT != '0' || steps.kernel_build.outcome == 'failure') && env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          set -euo pipefail
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=BunnyX BakaSU build failed | branch=${BRANCH} | run=${GITHUB_RUN_NUMBER} | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -f error_report/summary.txt ]; then
            curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F document=@error_report/summary.txt
          fi

      - name: Telegram Notify - Success
        if: success() && env.BUILD_EXIT == '0' && env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=BunnyX BakaSU build complete | branch=${BRANCH} | run=${GITHUB_RUN_NUMBER} | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Upload Artifact
        if: success() && env.BUILD_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: BunnyX-${{ env.BRANCH }}-${{ github.run_number }}
          path: out/*.zip
          retention-days: 7
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && env.BUILD_EXIT == '0'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          name: "BunnyX Kernel ${{ github.ref_name }}"

      - name: Check Build Status
        if: always() && (env.BUILD_EXIT != '0' || steps.kernel_build.outcome == 'failure')
        run: |
          echo "Build or migration failed."
          exit 1
